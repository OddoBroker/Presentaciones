<title>Señalética QR · Encuesta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Cartel vertical único, pensado para imprimir: pieza hermana de la señalética
   del programa, mismo sistema, con una etiqueta propia para distinguirla a
   simple vista en el stand: Oddi + etiqueta "Encuesta" + frase corta + QR + logo. */
:root{
  --navy:#1C1D3B; --magenta:#D53861; --teal:#2E92B8; --pale:#C9F1FF;
  --bg:#EAF8FF; --fg:#1C1D3B; --muted:#5C6178;
  --font-display:'Poppins',system-ui,sans-serif;
  --font-accent:'Noto Serif',Georgia,serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:linear-gradient(170deg,var(--pale),var(--bg) 65%); color:var(--fg); font-family:var(--font-display);
  display:flex; align-items:center; justify-content:center;
  padding:max(28px, env(safe-area-inset-top,0px)) max(24px, env(safe-area-inset-right,0px)) max(28px, env(safe-area-inset-bottom,0px)) max(24px, env(safe-area-inset-left,0px));
}
.card{
  width:100%; max-width:480px; aspect-ratio:3/4.2; border-radius:28px; background:#fff; box-shadow:0 30px 60px -30px rgba(28,29,59,.35);
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
  padding:5% 7%; position:relative; overflow:hidden; text-align:center;
}
.wm{position:absolute; inset:auto -10% -10% auto; width:38%; opacity:.1; pointer-events:none}
.top{display:flex; flex-direction:column; align-items:center; position:relative; z-index:1}
.colegio{font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:700}
.tag{margin-top:3%; background:var(--magenta); color:#fff; font-size:.66rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:6px 14px; border-radius:999px}
.oddi{width:30%; height:auto; margin-top:2.5%}
h1{font-size:1.5rem; line-height:1.14; margin:3% 0 0; text-wrap:balance; color:var(--navy)}
.sub{font-family:var(--font-accent); font-style:italic; color:var(--magenta); font-size:.9rem; margin-top:2%}
.qrbox{
  background:var(--navy); border-radius:18px; padding:3.5%; display:flex; align-items:center; justify-content:center;
  position:relative; z-index:1; margin-top:2%; margin-bottom:5%;
}
.qrbox img{width:34vw; max-width:160px; height:auto; display:block; border-radius:8px}
.bottom{display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; z-index:1}
.logo{height:40px; width:auto}
.hint{font-size:.7rem; color:var(--muted)}
@media (min-width:640px){ h1{font-size:1.85rem} .sub{font-size:1.02rem} }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Noto+Serif:ital,wght@1,400;1,600&display=swap">
